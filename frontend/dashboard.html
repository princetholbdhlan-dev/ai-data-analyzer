<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalytixAI — Dashboard Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #080a12; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(15, 18, 35, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-radius: 16px; }
        .text-gradient { background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary { background: linear-gradient(135deg, #9333ea 0%, #0891b2 100%); }
    </style>
</head>
<body class="bg-[#080a12] text-slate-400 min-h-screen flex flex-col">

    <!-- TOP BAR NAV -->
    <header class="border-b border-slate-800 bg-[#0b0e1b] px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center text-white font-bold text-sm">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <span class="text-lg font-bold text-white">Analytix<span class="text-purple-400">AI</span></span>
        </a>
        <div class="flex items-center gap-4">
            <span id="userDisplayName" class="text-xs font-semibold text-purple-300 bg-purple-950/80 px-3 py-1.5 rounded-full border border-purple-800/50">Demo User</span>
            <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 transition-colors"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="max-w-7xl mx-auto w-full p-6 flex-1 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- FILE UPLOAD & STATS PANEL -->
        <section class="glass-card p-6 md:col-span-1 flex flex-col gap-6">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up text-purple-400"></i> Upload Dataset
            </h2>

            <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-purple-500/50 rounded-xl p-6 text-center cursor-pointer transition-all bg-slate-900/40">
                <i class="fa-solid fa-file-csv text-3xl text-purple-400 mb-2"></i>
                <p class="text-xs text-slate-300 font-semibold mb-1">Click or Drag CSV/Excel file here</p>
                <p class="text-[10px] text-slate-500">Supports .csv, .xlsx (Max 20MB)</p>
                <input type="file" id="fileInput" class="hidden" accept=".csv, .xlsx, .xls">
            </div>

            <!-- SUMMARY STATS CARD -->
            <div id="statsCard" class="hidden space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                <h3 class="text-xs font-bold text-purple-300 uppercase tracking-wider">Cleaning Summary</h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-slate-950/60 p-2 rounded border border-slate-800"><span class="text-slate-500 block">Total Rows</span><strong id="statRows" class="text-white">0</strong></div>
                    <div class="bg-slate-950/60 p-2 rounded border border-slate-800"><span class="text-slate-500 block">Columns</span><strong id="statCols" class="text-white">0</strong></div>
                    <div class="bg-slate-950/60 p-2 rounded border border-slate-800"><span class="text-slate-500 block">Duplicates Removed</span><strong id="statDuplicates" class="text-emerald-400">0</strong></div>
                    <div class="bg-slate-950/60 p-2 rounded border border-slate-800"><span class="text-slate-500 block">Missing Handled</span><strong id="statMissing" class="text-cyan-400">0</strong></div>
                </div>
            </div>
        </section>

        <!-- DATA WORKSPACE & AI QUERY -->
        <section class="glass-card p-6 md:col-span-2 flex flex-col gap-6">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i> AI Data Workspace
            </h2>

            <!-- QUERY INPUT -->
            <div class="flex gap-2">
                <input type="text" id="queryInput" placeholder="Ask AI e.g. 'Show dataset summary' or 'List columns'..." class="flex-1 bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500 transition-colors">
                <button onclick="sendQuery()" class="btn-primary px-5 py-2.5 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-600/20">Ask</button>
            </div>

            <!-- AI RESPONSE BOX -->
            <div id="aiResponseBox" class="hidden bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-xs text-slate-300 leading-relaxed">
                <strong class="text-purple-400 block mb-1"><i class="fa-solid fa-robot"></i> AI Assistant:</strong>
                <span id="aiResponseText">Analyzing data...</span>
            </div>

            <!-- DATA TABLE PREVIEW -->
            <div class="flex-1 overflow-x-auto border border-slate-800/80 rounded-xl bg-slate-950/50">
                <table id="previewTable" class="w-full text-left text-xs text-slate-400 min-w-[500px]">
                    <thead id="tableHeader" class="bg-slate-900 text-slate-300 font-semibold border-b border-slate-800">
                        <tr><th class="p-3">Upload a dataset to see clean preview...</th></tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
