<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalytixAI — Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #080a12; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(15, 18, 35, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-radius: 16px; }
        .btn-primary { background: linear-gradient(135deg, #9333ea 0%, #0891b2 100%); }
    </style>
</head>
<body class="bg-[#080a12] text-slate-400 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <div class="glass-card p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <span class="text-2xl font-extrabold text-white tracking-wide">Analytix<span class="text-purple-400">AI</span></span>
            </a>
            <h2 class="text-xl font-bold text-white mt-4">Reset Password</h2>
            <p class="text-xs text-slate-400 mt-1">Enter your registered email to receive reset instructions</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Reset link sent to your email!'); window.location.href='login.html';" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                    <input type="email" required placeholder="name@example.com" class="w-full bg-[#13172b] border border-slate-800 text-white text-xs rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-purple-500 transition-colors">
                </div>
            </div>

            <button type="submit" class="btn-primary w-full text-white text-xs font-bold py-3.5 rounded-xl shadow-lg shadow-purple-600/30 hover:opacity-95 transition-all">
                Send Reset Link →
            </button>
        </form>

        <p class="text-xs text-center text-slate-400 mt-6">
            Remembered your password? <a href="login.html" class="text-purple-400 hover:text-purple-300 font-semibold">Back to Login</a>
        </p>
    </div>

</body>
</html>
