<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalytixAI — Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #080a12; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(15, 18, 35, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-radius: 16px; }
        .glass-nav { background: rgba(8, 10, 18, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-primary { background: linear-gradient(135deg, #9333ea 0%, #0891b2 100%); }
    </style>
</head>
<body class="bg-[#080a12] text-slate-400 min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-400 flex items-center justify-center text-white font-black text-base shadow-lg shadow-purple-500/30">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <span class="text-xl font-extrabold text-white tracking-wide">Analytix<span class="text-purple-400">AI</span></span>
            </a>

            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="index.html" class="text-slate-300 hover:text-white">Platform</a>
                <a href="features.html" class="text-slate-300 hover:text-white">Tools</a>
                <a href="pricing.html" class="text-slate-300 hover:text-white">Pricing</a>
                <a href="contact.html" class="text-white font-semibold">Contact</a>
            </div>

            <div class="hidden md:flex items-center gap-4">
                <button onclick="alert('Phase 3')" class="text-sm font-semibold text-slate-300 hover:text-white">Log in</button>
                <button onclick="alert('Phase 3')" class="btn-primary text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg shadow-purple-600/30">Get Started Free →</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="pt-32 pb-20 px-6 max-w-lg mx-auto w-full">
        <div class="glass-card p-8">
            <h1 class="text-2xl font-bold text-white mb-2 text-center">Get in Touch</h1>
            <p class="text-xs text-slate-400 mb-6 text-center">Have a question or request? Send us a message.</p>

            <form onsubmit="event.preventDefault(); alert('Message sent successfully!');" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Your Name</label>
                    <input type="text" required placeholder="Prince Badlan" class="w-full bg-[#13172b] border border-slate-800 text-white text-xs rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" required placeholder="name@example.com" class="w-full bg-[#13172b] border border-slate-800 text-white text-xs rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Message</label>
                    <textarea required rows="4" placeholder="How can we help?" class="w-full bg-[#13172b] border border-slate-800 text-white text-xs rounded-xl p-4 focus:outline-none focus:border-purple-500"></textarea>
                </div>
                <button type="submit" class="btn-primary w-full text-white text-xs font-bold py-3.5 rounded-xl shadow-lg shadow-purple-600/30">
                    Send Message →
                </button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-800/80 py-8 px-6 bg-[#05070e]">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-xs text-slate-400">
            <div>© 2026 AnalytixAI. All rights reserved.</div>
            <div class="flex gap-6">
                <a href="index.html" class="hover:text-white">Platform</a>
                <a href="features.html" class="hover:text-white">Tools</a>
                <a href="pricing.html" class="hover:text-white">Pricing</a>
                <a href="contact.html" class="hover:text-white">Contact</a>
            </div>
        </div>
    </footer>
</body>
</html>
