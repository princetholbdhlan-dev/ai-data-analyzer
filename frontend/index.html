<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Data Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>AI Data Analyzer</h1>
        <p>Upload your CSV or Excel file for instant analytics</p>

        <div class="upload-box">
            <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
            <button onclick="uploadAndAnalyze()">Analyze Data</button>
        </div>

        <div id="loading" style="display:none;">Analyzing Data... Please wait.</div>

        <div id="results" style="display:none;">
            <h2>Data Overview</h2>
            <p id="fileStats"></p>

            <h2>Summary Statistics</h2>
            <div id="statsTable"></div>

            <h2>Visual Chart</h2>
            <canvas id="myChart" width="400" height="200"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
